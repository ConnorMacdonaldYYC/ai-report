[project]
name = "ai-report"
version = "0.1.0"
description = "AI industry weekly newsletter agent built with Pydantic AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=1.97.0",
    "pydantic-settings>=2.14.1",
    "logfire>=4.33.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
]

[project.scripts]
ai-report = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]